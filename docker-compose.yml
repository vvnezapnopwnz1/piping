services:
  pipeqc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PIPEQC_SUPABASE_URL:?set PIPEQC_SUPABASE_URL in the server env file}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${PIPEQC_SUPABASE_PUBLISHABLE_KEY:?set PIPEQC_SUPABASE_PUBLISHABLE_KEY in the server env file}
        NEXT_PUBLIC_PIPEQC_MODE: ${PIPEQC_MODE:-supabase}
        NEXT_PUBLIC_DEMO_AUTOLOGIN_EMAIL: ${PIPEQC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_AUTOLOGIN_PASSWORD: ${PIPEQC_DEMO_PASSWORD:-}
    container_name: ${PIPEQC_CONTAINER_NAME:-pipeqc-app}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PIPEQC_PORT:-9700}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${PIPEQC_SUPABASE_URL:?set PIPEQC_SUPABASE_URL in the server env file}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${PIPEQC_SUPABASE_PUBLISHABLE_KEY:?set PIPEQC_SUPABASE_PUBLISHABLE_KEY in the server env file}
      NEXT_PUBLIC_PIPEQC_MODE: ${PIPEQC_MODE:-supabase}
